name: validate

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate changed packages (pull request)
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          DIRS=$(git diff --name-only "$BASE" "${{ github.event.pull_request.head.sha }}" | grep '^packages/' | cut -d/ -f1-2 | sort -u | sed 's#^#./#')
          if [ -z "$DIRS" ]; then echo "No package changes"; exit 0; fi
          node scripts/validate-registry.mjs $DIRS
      - name: Validate all packages (push to master)
        if: github.event_name == 'push'
        run: node scripts/validate-registry.mjs
